plugins {
    id "com.android.application"
}

android {
    namespace "com.despejo.gravador"
    compileSdk 35

    defaultConfig {
        applicationId "com.despejo.gravador"
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName "0.3"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // NDK que já vem instalado no GitHub Actions.
    if (System.getenv("ANDROID_NDK_HOME")) {
        ndkPath System.getenv("ANDROID_NDK_HOME")
        ndkVersion new File(System.getenv("ANDROID_NDK_HOME")).canonicalFile.name
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    signingConfigs {
        // Chave fixa só para testes: permite instalar uma versão nova por cima da anterior.
        teste {
            storeFile file("teste.keystore")
            storePassword "despejo"
            keyAlias "despejo"
            keyPassword "despejo"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.teste
        }
        // A versão "release" sai com o Whisper otimizado; a "debug" fica lenta demais para transcrever.
        release {
            signingConfig signingConfigs.teste
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
