plugins {
    id "com.android.application"
}

android {
    namespace "com.despejo.gravador"
    compileSdk 35

    defaultConfig {
        applicationId "com.despejo.gravador"
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName "0.2"
    }

    signingConfigs {
        // Chave fixa só para testes: permite instalar uma versão nova por cima da anterior.
        teste {
            storeFile file("teste.keystore")
            storePassword "despejo"
            keyAlias "despejo"
            keyPassword "despejo"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.teste
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
