name: App Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Baixar whisper.cpp
        run: git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git android/app/src/main/cpp/whisper.cpp

      - name: Gerar APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Publicar APK numa release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk despejo.apk
          gh release create "app-${{ github.run_number }}" despejo.apk \
            --target "${{ github.sha }}" \
            --title "Despejo (teste) #${{ github.run_number }}" \
            --notes "APK de teste gerado de ${{ github.ref_name }} (${{ github.sha }})." \
            --latest
